name: Build Ubuntu Touch click (OpenJDK port)

# The arm64 click of linux-port/: Mercurygram on OpenJDK 21 with atlas's
# framework. Unlike the sibling ART packaging this cross-compiles, so it runs on
# a normal x86_64 runner in minutes rather than natively in hours -- see
# linux-port/click/README.md.

on:
  push:
    branches: [jvm-native]
    paths:
      - 'linux-port/**'
      - 'TMessagesProj/jni/**'
      - 'clickable.yaml'
      - '.github/workflows/linux-port-click.yml'
  pull_request:
    paths:
      - 'linux-port/**'
      - 'clickable.yaml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write   # for the release step
    steps:
      - uses: actions/checkout@v4

      # Only the four the native build needs. td, whisper and the Tor plugin's
      # submodules stay un-initialized on purpose (linux-port/README.md).
      - name: Init the native submodules
        run: |
          git submodule update --init --depth 1 \
            TMessagesProj/jni/boringssl TMessagesProj/jni/ffmpeg \
            TMessagesProj/jni/dav1d TMessagesProj/jni/libvpx

      # Not /usr/local/lib/android: that is the runner's Android SDK, and AGP
      # needs it to configure the Android modules even though -PlinuxPort keeps
      # the port's build away from the NDK. Without it Gradle fails outright
      # with "SDK location not found" on :TMessagesProj_PluginTor.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost || true
          df -h /

      - name: Check the Android SDK is where Gradle expects
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          [ -d "${ANDROID_HOME:-/nonexistent}" ] ||
            { echo "no Android SDK: Gradle cannot configure the Android modules" >&2; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The x86_64 half: the app's jars and app.apk from Gradle. That is all the
      # container cannot make itself -- it builds the shim in there, against the
      # arm64 api-impl.jar, so building one here would mean building atlas here
      # too, which is exactly what the SDK exists to avoid.
      - name: Build the app jars and apk
        run: linux-port/build-classpath.sh

      # build-atlas.sh compiles the framework in the container, so the sources
      # have to be here. Pinned to the commit the SDK was built from
      # (click/atl-sdk.tag), so the framework and the prebuilt libraries it
      # links against come from the same atlas. skia is not cloned: the staged
      # prebuilt provides libskia.so and its headers (-Dskia-prebuilt).
      - name: Check out atlas at the pinned commit
        run: |
          sha=$(tr -d '[:space:]' < linux-port/click/atl-sdk.tag)
          sha=${sha#sdk-}
          git clone --filter=blob:none https://github.com/NotKit/atl-touch.git linux-port/atlas
          git -C linux-port/atlas checkout --detach "$sha"
          git -C linux-port/atlas --no-pager log --oneline -1

      - name: Install clickable
        run: pipx install clickable-ut

      # stage-prebuilt.sh pulls the arm64 inputs the container cannot build
      # (art's libandroidfw, ART's boot jars, GLFW, libskia.so and the headers
      # for them) from the atl-touch SDK release matching the atlas commit.
      - name: Build the click
        env:
          # auto: no atlas checkout exists here, so this resolves to the tag
          # pinned in linux-port/click/atl-sdk.tag. Set the repo variable to
          # override it for a one-off build.
          ATL_SDK_TAG: ${{ vars.ATL_SDK_TAG || 'auto' }}
        run: linux-port/click/make-click.sh

      - name: Upload the click
        uses: actions/upload-artifact@v4
        with:
          name: mercurygram-jvm-click-arm64
          path: linux-port/out/click/*.click
          if-no-files-found: error

      # Actions artifacts need a login to download; a prerelease does not, which
      # is what testers actually use.
      - name: Publish to a GitHub release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          click=$(ls linux-port/out/click/*.click)
          version=$(basename "$click" | sed 's/^[^_]*_\([^_]*\)_.*/\1/')
          tag="jvm-v${version}-${GITHUB_SHA::7}"
          gh release create "$tag" \
            --title "Mercurygram ${version} (OpenJDK port)" \
            --prerelease \
            --notes "Unofficial test build of Mercurygram for Ubuntu Touch 24.04 (arm64), running on a bundled OpenJDK 21 through atlas. Not a stable release." \
            || true
          gh release upload "$tag" "$click" --clobber
